name = "mkt-analytics-agent"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Daily ceilings. These are the spend control — raise them only deliberately.
# Research calls run web searches and cost far more than an interpretation.
[vars]
DAILY_INTERPRET = "400"
DAILY_RESEARCH  = "60"
HOURLY_PER_IP   = "12"

# Request counters. Create with:
#   npx wrangler kv namespace create QUOTA
# then paste the id it prints below.
[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_KV_ID"
