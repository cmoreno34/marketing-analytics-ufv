name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Vite does not resolve identifiers, so a reference to a name that does
      # not exist builds cleanly and blanks the page in the browser. Lint first.
      - run: npm run lint
      # The clustering maths is checked against SciPy reference output on every
      # deploy: a wrong dendrogram would be published silently otherwise.
      - run: node --test test/algorithms.test.js
      # Elasticities, standard errors and F tests against statsmodels.
      - run: node --test test/elasticity.test.js
      # The course Worker lives at mkt-analytics-agent.<subdomain>.workers.dev,
      # where <subdomain> belongs to the Cloudflare account. When the Cloudflare
      # secrets exist, ask Cloudflare for it so the site points at the Worker
      # that worker.yml deployed; otherwise keep the default in src/lib/api.js.
      - name: Find the Worker URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          if ! [[ "$T" =~ ^[A-Za-z0-9_-]+$ ]]; then T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{35,}' | tail -1); fi
          echo "::add-mask::$T"
          CLOUDFLARE_API_TOKEN="$T"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
            if [ -n "$SUB" ]; then
              echo "VITE_WORKER_URL=https://mkt-analytics-agent.$SUB.workers.dev" >> "$GITHUB_ENV"
              echo "Worker URL: https://mkt-analytics-agent.$SUB.workers.dev"
            fi
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
