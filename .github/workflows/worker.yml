name: Deploy the course Worker

# Deploys worker/ to Cloudflare from GitHub, so nothing has to be installed or
# run on the lecturer's computer. Runs when worker/ changes, or by hand from
# the Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Cloudflare dashboard
# Optional:
#   ANTHROPIC_API_KEY      turns on the AI features of module 4
#   ACCESS_CODE            gates the service behind a course code
#
# Without the Cloudflare secrets the job explains what is missing and stops;
# the site keeps working, only live class sessions and AI are unavailable.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            {
              echo "### Worker not deployed"
              echo "Add the repository secrets **CLOUDFLARE_API_TOKEN** and **CLOUDFLARE_ACCOUNT_ID**,"
              echo "then run this workflow again from the Actions tab."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20

      - run: npm ci
        if: steps.gate.outputs.ready == 'true'

      - name: Type-check
        if: steps.gate.outputs.ready == 'true'
        run: npx tsc -p .

      # Says plainly what is wrong with the token or the account id, if anything.
      # Spaces or line breaks pasted around the token are removed first; the
      # value itself is never printed, only its length and shape.
      - name: Check the token
        if: steps.gate.outputs.ready == 'true'
        run: |
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$T"
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
          CLOUDFLARE_API_TOKEN="$T"
          echo "Token length: ${#T} · only letters, digits, - and _: $([[ "$T" =~ ^[A-Za-z0-9_-]+$ ]] && echo yes || echo NO — something other than the token was pasted)"
          echo "Token check:"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors}'
          echo "Account check:"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" | jq -c '{success, name: .result.name, errors}'
          echo "KV check:"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -c '{success, errors}'

      # The request-counter KV namespace. Created on the first run and found by
      # its title afterwards, so its id never has to be pasted into the repo.
      - name: Request-counter storage
        if: steps.gate.outputs.ready == 'true'
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          TITLE="mkt-analytics-agent-QUOTA"
          ID=$(curl -s -H "$AUTH" "$API?per_page=100" | jq -r --arg t "$TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "$AUTH" -H "content-type: application/json" -d "{\"title\":\"$TITLE\"}" "$API" | jq -r '.result.id // empty')
          fi
          if [ -z "$ID" ]; then echo "Could not find or create the KV namespace — check the token has Workers KV Storage: Edit."; exit 1; fi
          sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.toml
          echo "KV namespace $ID"

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Secrets for the Worker
        if: steps.gate.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi
          if [ -n "$ACCESS_CODE" ]; then printf '%s' "$ACCESS_CODE" | npx wrangler secret put ACCESS_CODE; fi

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### Worker deployed"
            echo "URL: $URL"
            echo ""
            echo "Status: $URL/status"
          } >> "$GITHUB_STEP_SUMMARY"

      # Rebuild the site so it points at this Worker's URL.
      - name: Rebuild the site
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
